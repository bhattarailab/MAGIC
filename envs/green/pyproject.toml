[project]
name = "green"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate==0.30.1",
    "datasets==3.2.0",
    "opencv-python==4.10.0.84",
    "pandas>=3.0.5",
    "pillow==10.3.0",
    "protobuf>=7.36.1",
    "scikit-learn>=1.9.0",
    "sentence-transformers==3.0.1",
    "sentencepiece==0.2.0",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "transformers==4.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["green_score"]

