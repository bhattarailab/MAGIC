[project]
name = "llava-med"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets==4.4.1",
    "dotenv>=0.9.9",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "protobuf==6.33.0",
    "scikit-learn==1.2.2",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "sentencepiece==0.1.99",
    "tiktoken==0.12.0",
    "timm==0.9.12",
    "tokenizers==0.15.2",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers==4.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llava"]
